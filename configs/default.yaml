project_name: "grid-guard"
environment: "development"
random_seed: 42
log_level: "INFO"

dataset:
  name: "sgcc_electricity_theft"
  raw_filename: "electric-data.csv"
  format: "csv"
  layout: "wide"
  allow_negative_consumption: false
  columns:
    meter_id: "CONS_NO"
    timestamp: null
    consumption: null
    label: "FLAG"
    tariff: null
    customer_category: null
    feeder_id: null

tracking:
  experiment_name: "grid-guard-ntl-detection"

features:
  lags: [1, 2, 3, 7, 14, 30]
  rolling_windows: [7, 14, 30, 60, 90]
  step_down_recent_window: 14
  step_down_baseline_window: 60
  step_down_baseline_lag: 14
  zero_threshold: 0.001
  flatline_tolerance: 0.01
  min_history_days: 30
  epsilon: 0.0001
  batch_size_meters: 10000

financial:
  currency: "USD"
  dispatch_cost: 100.0
  default_tariff: 0.15
  tariff_source: "assumed_fallback"
  undetected_cycles: 12
  leakage_window_days: 30
  min_leakage_kwh: 5.0

baseline:
  model_type: "lightgbm"
  target_col: "tamper_label"
  objective: "binary"
  metric: "binary_logloss"
  learning_rate: 0.05
  n_estimators: 200
  max_depth: 6
  num_leaves: 31
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  threshold: 0.5
  sampling_stride_days: 30
  train_start: "2014-04-01"
  train_end: "2015-12-31"
  val_start: "2016-01-01"
  val_end: "2016-05-31"
  test_start: "2016-06-01"
  test_end: "2016-10-31"
  top_k_values: [10, 50, 100, 500, 1000, 2000]

imbalance:
  strategy: "class_weight"
  class_weight_multiplier: 1.0
  target_pos_ratio: 0.20
  selection_metric: "pr_auc"
  threshold: 0.5
  random_seed: 42
  weight_multipliers: [1.0, 2.0, 3.0, 5.0, 10.72]
  oversample_ratios: [0.15, 0.25, 0.50]
  undersample_ratios: [0.20, 0.33, 0.50]
  smote_k_neighbors: 5
  smote_sample_size_cap: 50000

cost_sensitive:
  enabled: true
  objective_name: "cost_sensitive_weighted_logistic"
  dispatch_cost: 100.0
  default_tariff: 0.15
  tariff_source: "assumed_fallback"
  undetected_cycles: 12
  min_leakage_kwh: 5.0
  min_fn_cost: 100.0
  cost_normalization: "dispatch_cost"
  cost_capping: false
  cost_cap_percentile: 99.5
  threshold: 0.5
  calibration_method: "isotonic"
  selection_metric: "total_operational_loss"
  random_seed: 42

decision:
  decision_rule: "env"
  dispatch_cost: 100.0
  default_tariff: 0.15
  recovery_factor: 1.0
  undetected_cycles: 12
  min_leakage_kwh: 5.0
  min_probability: 0.0
  min_recoverable_revenue: 0.0
  min_env: 0.0
  fixed_threshold: 0.5
  max_inspections_per_period: null
  capacity_policy: "strictly_positive_env"
  ranking_strategy: "env_descending"
  probability_source: "calibrated"
  aggregation_period: "latest_snapshot"
  top_k_values: [10, 25, 50, 100, 250, 500, 1000, 2000]
  random_seed: 42

explainability:
  global_sample_size: 500
  top_k_tickets: 100
  max_positive_features: 4
  max_negative_features: 2
  step_down_ratio_threshold: 0.50
  step_down_min_days: 7
  zero_streak_min_days: 3
  zero_consumption_threshold: 0.001
  flatline_max_cv: 0.05
  flatline_min_days: 7
  random_seed: 42



